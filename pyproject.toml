[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mason"
version = "0.1.0"
description = "An AI student that learns only from a course's materials, to find where the materials fall short."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0,<3",
  "pydantic>=2",
  "sqlmodel>=0.0.20",
  "pyyaml>=6",
  "pypdf>=4",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "jinja2>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mason = "mason.cli:main"

[tool.setuptools.packages.find]
include = ["mason*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Claude API (costs money); run with `pytest -m live`"]
addopts = "-m 'not live'"
