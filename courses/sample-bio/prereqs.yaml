# What a 10th-grade biology student is assumed to know before this unit (approved).
# Mason may use ONLY these plus the lessons it has attended. Nothing here may be taught by the course.
prerequisites:
  - "Reading comprehension at grade level; basic arithmetic, ratios, percentages, area and volume of a cube."
  - "Reading simple graphs and tables."
  - "Matter is made of atoms; atoms join to form molecules; chemical formulas show which atoms a molecule contains (e.g. H2O, CO2, O2)."
  - "In a chemical reaction, reactants are turned into products; arrows in an equation point from reactants to products."
  - "A solution is made of a solute dissolved in a solvent; concentration is the amount of solute in a given volume."
  - "Particles of liquids and gases are constantly moving; they move faster at higher temperature."
  - "Energy can change from one form to another (light, chemical, heat, motion) but is not created or destroyed."
  - "The pH scale: below 7 is acidic, 7 is neutral, above 7 is basic."
  - "Living things need energy and take in materials from their surroundings; plants need light, water and air to grow; animals eat food and breathe."
  - "A microscope makes small objects look larger."
