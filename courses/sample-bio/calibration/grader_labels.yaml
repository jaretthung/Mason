  - {question: Q27, correct: false, answer: "About 7, neutral."}
  # Q33 oxygen's role
  - {question: Q33, correct: true,  answer: "Oxygen is the last electron acceptor at the end of the electron transport chain; it grabs the electrons and joins with H+ to make water."}
  - {question: Q33, correct: false, answer: "Oxygen is needed to make glucose."}
  - {question: Q33, correct: false, answer: "Oxygen accepts electrons at the end of the chain."}
