  stem: Why does a glimmerwort that cannot get enough selite die in the cold?
  answer: Selite is needed to build the vesk; without enough, the vesk is thin and brittle and the cells crack in the cold.
  rubric:
  - Selite is needed to build the vesk
  - A thin/brittle vesk lets the cells crack in the cold
