- id: G07
  type: short
  stem: A glimmerwort in slow-burn uses 10 grains of amberlipid. A neighbor uses 10 grains of calorite. How much more glim
    does the neighbor make?
  answer: 'Slow-burn: 10 x 1 = 10 glim. Calorite: 10 x 5 = 50 glim. The neighbor makes 40 more glim.'
  rubric:
  - Slow-burn gives 10 glim (1 per grain)
  - Calorite gives 50 glim (5 per grain)
  - Difference of 40 glim
