  type: short
  stem: Could a starving glimmerwort 5 meters away from a healthy one be helped by root-pairing? Explain.
  answer: 'No: root-pairing only happens between glimmerworts within 2 meters of each other.'
  rubric:
  - 'No'
  - Root-pairing only happens within 2 meters
