- id: G13
  type: short
  stem: A glimmerwort glows red. Its neighbor, 1.5 meters away, glows blue. What can the neighbor do to help, and how?
  answer: 'Root-pairing: it grows its root-mat toward the red one until they fuse, then passes glim to it. It''s within 2
    meters, so this is possible.'
  rubric:
  - Root-pairing / fuse root-mats
  - Passes glim to the starving glimmerwort
  tags:
    lessons:
    - L3
    concepts:
    - root_pairing
  sufficient: true
