    lessons:
    - L2
    concepts:
    - slow_burn
  sufficient: true
- id: G08
  type: short
  stem: Explain how glowing brightly helps a glimmerwort build a stronger vesk.
  answer: Bright light attracts more drift-moths, which drop selite dust that the root-mat absorbs; selite is what the vesk
    is built from.
  rubric:
  - Glow attracts drift-moths
  - Drift-moths drop selite, which is absorbed by the root-mat
  tags:
    lessons:
    - L2
    concepts:
    - glow_purpose
  sufficient: true
